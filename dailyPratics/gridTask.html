<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            background-color: #020228;
        }
        html,body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #020228;
            display: flex;
            justify-content: center;
            align-items: center;
}
        #main-Container{
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 250px 250px 250px 250px;
            grid-template-rows: 250px 250px 250px;
        }
        .box{
            margin: 5px;
        }
        #box1{
            background-color: #047804;
            /* width: 150px; */
            /* height: 150px; */
            grid-row: 1/4;
            grid-column: 1/2;
        }
        #box2{
            background-color: #047804;
            /* width: 150px; */
            /* height: 150px; */
            grid-row: 1/2;
            grid-column: 2/4;
        }
        #box3{
            background-color: #047804;
            /* width: 150px;
            height: 150px; */
             grid-row: 2/4;
            grid-column: 4/5;
        }
        #box4{
            background-color: #ffa807;
            /* width: 150px;
            height: 150px; */
            grid-row: 2/3;
            grid-column: 2/3;
        }
        #box5{
            background-color: #ffa807;
            /* width: 150px;
            height: 150px; */
             grid-row: 3/4;
            grid-column: 3/4;
        }
        #box6{
            background-color: #f32808;
            /* width: 150px;
            height: 150px; */
            grid-row: 1/2;
            grid-column: 4/5;
        }
        #box7{
            background-color: #f32808;
            /* width: 150px;
            height: 150px; */
             grid-row: 2/3;
            grid-column: 3/4;
        }
        #box8{
            background-color: #f32808;
            /* width: 150px;
            height: 150px; */
            grid-row: 3/4;
            grid-column: 2/3;
        }
    </style>
</head>
<body>
    <div id="main-Container">
        <div class="box" id="box1"></div>
        <div class="box" id="box2"></div>
        <div class="box" id="box3"></div>
        <div class="box" id="box4"></div>
        <div class="box" id="box5"></div>
        <div class="box" id="box6"></div>
        <div class="box" id="box7"></div>
        <div class="box" id="box8"></div>
    </div>
</body>
</html>
