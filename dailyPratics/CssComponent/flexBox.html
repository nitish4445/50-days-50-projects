<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #container{
            border: 2px solid black;
            display: flex;
            width: 100%;
            height: 500px;
            flex-direction: row;
            justify-content: center;
            align-items: center;
        }
        .box{
            width: 100px;
            height: 100px;
            margin: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: x-large;
        }
        #box1{
            background-color: red;
        }
        
        #box2{
            background-color: #1902e3;
        }
        
        #box3{
            background-color: #0dff00;
        }
        
        #box4{
            background-color: #00ffc8d8;
        }
        
        #box5{
            background-color: #ff009d;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="box1" class="box">1</div>
        <div id="box2" class="box">2</div>
        <div id="box3" class="box">3</div>
        <div id="box4" class="box">4</div>
        <div id="box5" class="box">5</div>
    </div>
</body>
</html>
